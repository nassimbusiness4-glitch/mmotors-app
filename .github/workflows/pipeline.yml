# Nom du pipeline affiché sur GitHub
name: Pipeline M-Motors

# Quand le lancer : à chaque push sur main et à chaque pull request
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Machine Linux prêtée par GitHub
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Installer les outils
        run: pip install -r requirements.txt

      - name: Lancer MY Test
        run: pytest

  build:
    # Attend que le test soit vert
    needs: test
    # Seulement après un merge sur main, pas sur une pull request
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Se connecter à AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Se connecter à ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construire et envoyer l'image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/mmotors-app
        run: |
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
    