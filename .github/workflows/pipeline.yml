# Nom du pipeline affiché sur GitHub
name: Pipeline M-Motors


# Quand le lancer : à chaque push sur main, à chaque pull request, ou à la main
on:
  push:
    branches: [main]
  pull_request:
  # Permet de lancer le pipeline à la main (bouton "Run workflow")
  workflow_dispatch:

jobs:
  test:
    # Machine Linux prêtée par GitHub
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Installer les outils
        run: pip install -r requirements.txt

      - name: Lancer MY Test
        run: pytest

  build:
    # Attend que le test soit vert
    needs: test
    # Pas sur une pull request, car (on verifie sans livrer)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Se connecter à AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Se connecter à ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construire et envoyer l'image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/mmotors-app
        run: |
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
    
  deploy:
    # Attend que l'image soit envoyée sur ECR
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Se connecter à AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Relancer ECS avec la nouvelle image
        run: aws ecs update-service --cluster mmotors-cluster --service mmotors-app --force-new-deployment

      - name: Attendre que le déploiement soit terminé
        run: aws ecs wait services-stable --cluster mmotors-cluster --services mmotors-app
